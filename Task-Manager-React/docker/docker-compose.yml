services:
  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: react_frontend_tasks
    ports:
      - "5173:80"
    volumes:
      - ../:/app
      - react_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      # Testa se o Nginx está respondendo internamente na porta 80
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  react_node_modules:
    name: react_frontend_node_modules
